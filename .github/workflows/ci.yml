name: CI

on:
  push:
    branches: [ offload-prototype ]
  pull_request:
    branches: [ offload-prototype ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config
          # debug: confirm libudev.pc is there
          dpkg -L libudev-dev | grep libudev.pc || true

      - uses: Swatinem/rust-cache@v2

      # ★変更: PKG_CONFIG_PATH を明示
      - name: Cargo build (release, all targets)
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
        run: cargo build --release --workspace --all-targets
